name: Long-OS ISO

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-x86-64-linux-gnu nasm xorriso mtools

    - name: Build OS
      run: make all

    - name: Generate ISO
      run: make iso

    - name: Upload ISO Artifact
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: LongOS-Live-ISO
        path: build/longos-live.iso
